<!doctype html>

<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Sleep Outside | Checkout</title>
  <script src="../js/checkout.js" type="module"></script>

  <link rel="stylesheet" href="../css/style.css" />
</head>

<body>
  <header class="divider" id="header">

  </header>

  <main class="divider checkout-page">
    <aside class="order-summary checkout-panel checkout-panel--summary">
      <h2>Order Summary</h2>
      <p>Subtotal: <span id="cartTotal"></span></p>
      <p>Tax: <span id="tax"></span></p>
      <p>Shipping: <span id="shipping"></span></p>
      <p>Order Total: <span id="orderTotal"></span></p>
    </aside>

    <section class="checkout-panel checkout-panel--form">
      <form id="checkout-form">
        <div class="checkout-section">
          <h2>Shipping Information</h2>
          <div class="form-grid">
            <p>
              <label for="fname">First Name:</label>
              <input type="text" id="fname" name="name" autocomplete="given-name" required />
            </p>
            <p>
              <label for="lname">Last Name:</label>
              <input type="text" id="lname" name="name" autocomplete="family-name" required />
            </p>

            <p>
              <label for="email">Email:</label>
              <input type="email" id="email" name="email" autocomplete="email" required />
            </p>

            <p>
              <label for="address">Address:</label>
              <input type="text" id="address" name="address" autocomplete="street-address" required />
            </p>

            <p>
              <label for="city">City:</label>
              <input type="text" id="city" name="city" autocomplete="address-level2" required />
            </p>

            <p>
              <label for="state">State:</label>
              <input type="text" id="state" name="state" autocomplete="address-level1" required />
            </p>

            <p>
              <label for="zip">Zip Code:</label>
              <input type="text" id="zip" name="zip" inputmode="numeric" autocomplete="postal-code" required />
            </p>
          </div>
        </div>

        <div class="checkout-section">
          <h2>Billing Information</h2>
          <div class="form-grid">
            <p>
              <label for="card">Credit Card Number:</label>
              <input type="text" id="card" name="card" inputmode="numeric" autocomplete="cc-number" required />
            </p>
            <p>
              <label for="exp">Expiration Date:</label>
              <input type="text" id="exp" name="exp" autocomplete="cc-exp" placeholder="MM/YY" required />
            </p>
            <p>
              <label for="cvc">Security Code:</label>
              <input type="text" id="cvc" name="cvc" inputmode="numeric" autocomplete="cc-csc" required />
            </p>
          </div>
        </div>

        <p class="checkout-submit">
          <button type="submit" id="checkoutSubmitBtn">Place Order</button>
        </p>
      </form>
    </section>
  </main>

  <footer id="footer"></footer>
</body>

</html>
